; PlatformIO Project Configuration
; TRAZZO IoT Attendance Module — ESP32 DevKit V1
;
; Build environments:
;   - esp32-wokwi   : simulation in Wokwi (Serial scanner, Wokwi-GUEST WiFi)
;   - esp32-dev     : flashing on the physical ESP32 with the GM66 scanner on Serial2

[platformio]
default_envs = esp32-wokwi
src_dir = src
include_dir = include
lib_dir = lib

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DCONFIG_FREERTOS_USE_TRACE_FACILITY=1
    -DCONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=1
    -DARDUINO_USB_CDC_ON_BOOT=0

build_unflags =
    -std=gnu++11

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    bblanchon/ArduinoJson @ ^7.2.1
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    ricmoo/QRCode @ ^0.0.1
    bodmer/TFT_eSPI @ ^2.5.43

monitor_filters =
    esp32_exception_decoder
    time
    default

; ─────────────────────────────────────────────────────────────────────
; Wokwi simulation environment
; - Uses Serial for "scanner" input (typed in Wokwi serial monitor)
; - WiFi SSID "Wokwi-GUEST" (no password)
; - Backend URL points to the deployed dev backend (or ngrok tunnel)
; ─────────────────────────────────────────────────────────────────────
[env:esp32-wokwi]
build_flags =
    ${env.build_flags}
    -DTRAZZO_BUILD_WOKWI=1
    -DTRAZZO_SCANNER_MOCK=1
    -DTRAZZO_WIFI_SSID=\"Wokwi-GUEST\"
    -DTRAZZO_WIFI_PASS=\"\"

; ─────────────────────────────────────────────────────────────────────
; Physical hardware environment
; - Reads scanner from Serial2 (GM66) at 9600 baud
; - WiFi credentials come from NVS (configured via captive portal)
; - Display: ILI9341 2.8" TFT (SPI) — replaces the small SSD1306 OLED
; ─────────────────────────────────────────────────────────────────────
[env:esp32-dev]
upload_port = COM3                   ; override at flash time if different
monitor_port = COM3
build_flags =
    ${env.build_flags}
    -DTRAZZO_BUILD_DEVICE=1
    -DTRAZZO_SCANNER_MOCK=0
    -DTRAZZO_USE_TFT=1
    ; ─── TFT_eSPI User_Setup via build flags (ILI9341 + XPT2046 touch) ───
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=32
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=14
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
